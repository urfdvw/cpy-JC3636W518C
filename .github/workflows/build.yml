name: Build firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CP_VERSION: "10.3.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [guition_jc3636w518c, guition_jc3636w518c_v2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host packages
        run: sudo apt-get update && sudo apt-get install -y gettext cmake ninja-build

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ env.CP_VERSION }}

      - name: Build
        run: ./build.sh ${{ matrix.board }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
